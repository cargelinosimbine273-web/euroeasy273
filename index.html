/* =====================================================================

:root{

}
body::before{

    radial-gradient(1000px 560px at 8% -10%,rgba(139,92,246,.30),transparent 62%),

    radial-gradient(900px 620px at 50% 108%,rgba(245,158,11,.13),transparent 62%);
}
body::after{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.35;
  background-image:radial-gradient(rgba(255,255,255,.10) 1px,transparent 1px);

}
img{display:block;max-width:100%}

h1,h2,h3,h4{line-height:1.14;letter-spacing:-.025em;margin:0 0 .5em;font-weight:800}

/* ---------- BUTTONS ---------- */
.btn{

.collage{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:14px;perspective:1200px}

}

.marquee{overflow:hidden;border-top:1px solid var(--line);border-bottom:1px solid var(--line);

.marquee span::after{content:"◆";color:rgba(236,72,153,.75);font-size:.6rem}

/* ---------- SECTIONS ---------- */
section{padding:62px 0}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:30px;flex-wrap:wrap}
.sec-head p{margin:0;color:var(--muted);font-size:.96rem;max-width:62ch}

.sec-head .more:hover{text-decoration:underline}
.eyebrow{font-size:.74rem;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:var(--pink);margin-bottom:10px}

/* ---------- PRODUCT CARD ---------- */
.grid{display:grid;gap:22px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.pcard{
  background:linear-gradient(180deg,var(--surface),var(--bg-2));

}
.pcard::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;

.toolbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:28px}

.cta-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

/* ---------- FOOTER ---------- */
footer{border-top:1px solid var(--line);margin-top:60px;padding:52px 0 28px;background:rgba(4,5,8,.6)}
.fgrid{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:34px}

  display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

  .nav-links.open{display:flex}

@media (max-width:560px){

}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .reveal{opacity:1;transform:none}
}

      <p>First things first: <strong>I am not a financial advisor</strong> and nothing here is investment advice. Crypto is volatile and you can lose all of your money — even with the best tool in the world.</p>
      <h2>What btcBeep is</h2>
      <p>An app that generates <strong>BUY / SELL / WAIT</strong> signals for Bitcoin and Ethereum based on more than 50 technical indicators. It sends real-time push notifications and works on three horizons: today, short term and long term.</p>
      <h2>What I liked</h2>
      <ul>
        <li><strong>Simplicity:</strong> one clear call instead of fifteen indicators on a screen.</li>
        <li><strong>Public history:</strong> the site shows the last signals live — the good ones <em>and</em> the bad ones. That is rare and it builds trust.</li>
        <li><strong>One-time payment:</strong> no monthly subscription eating your profits.</li>
        <li><strong>Notifications:</strong> they arrive even with the app closed.</li>
      </ul>
      <h2>What nobody should forget</h2>
      <p>The site highlights a high win rate over the last 60 signals. That is a snapshot of one period — every strategy has good and bad phases. A "good" signal also depends on when you enter, how much you put in and when you exit.</p>
      <blockquote><p>A signal shows a probable direction, not a certainty. What separates survivors from losers is not the signal — it is position size and stop losses.</p></blockquote>
      <h2>Who it makes sense for</h2>
      <p>People who already understand the basics of trading and want to cut the analysis noise. If you have never bought crypto, learn first — do not buy signals.</p>
      [[prod:btcbeep]]
      <h2>Rules I follow</h2>
      <ul>
        <li>Never invest more than I can afford to lose entirely.</li>
        <li>Always set a stop before entering.</li>
        <li>No overtrading: three signals a day is plenty.</li>
        <li>Log every trade — without a log there is no learning.</li>
      </ul>
      <p><strong>Disclaimer:</strong> informational content only. Not an investment recommendation. Past performance does not guarantee future results.</p>
    `

      <p>Learning two languages at once is possible — but it needs a method. Most people quit because they mix the languages up or try to start everything in the same week.</p>
      <h2>What is inside the pack</h2>
      <ul>
        <li><strong>4 PDF eBooks</strong> (German, English, Spanish, French), 46 chapters each.</li>
        <li>Ready-to-use phrases for travel, work and daily life.</li>
        <li>Simplified pronunciation — written the way it sounds.</li>
        <li>Practice dialogues to read out loud.</li>
        <li>A 7-day starter plan per language.</li>
      </ul>
      <h2>How I would use it</h2>
      <p>Do not start all four at once. Pick <strong>one main language</strong> and <strong>one secondary</strong>. The main one gets 20 minutes a day; the secondary only on days with spare time. After two months, switch.</p>
      <blockquote><p>Four languages at once is the recipe for learning none. Two, with a fixed routine, works.</p></blockquote>
      <h2>Strengths and limits</h2>
      <p><strong>Strength:</strong> practicality. It is built to be used, not to study grammar. Great if you are travelling in a few weeks.</p>

    body: `
      <p>Everyone talks about AI. Few use it in a way that actually saves time. The difference is almost always <strong>how you ask</strong>, not which tool you use.</p>
      <h2>The most common mistake</h2>
      <p>Asking "write a text about sales". The answer will be generic — because the request is generic. AI does not guess your context: you have to give it.</p>
      <blockquote><p>If your prompt could fit on a street poster, it is too vague. Give context, goal and format.</p></blockquote>
      <h2>Three uses that save hours</h2>
      <ul>
        <li><strong>Summarise:</strong> paste a long document and ask for ten bullet points.</li>
        <li><strong>Rewrite:</strong> "make this email shorter and clearer without losing warmth".</li>
        <li><strong>Structure:</strong> "build a 7-day plan with one task per day to launch a sales page".</li>
      </ul>
      <h2>Where AI fails</h2>
      <p>It invents facts confidently, does not know your business and takes no responsibility for errors. Anything involving numbers, law or health has to be checked by a human.</p>
      <h2>Learning with structure</h2>
      <p>If you want to go beyond copying prompts from the internet, a guide with practical exercises speeds things up a lot.</p>
      [[prod:ai-ebook]]
      <h2>Start today</h2>
      <p>Pick one boring task from your week and try to automate it with AI. One task, once. Then expand.</p>

    body: `
      <p>Anyone with a pet knows: they live too short a life and we want it to be a good one. The good news is that the factors with the biggest influence are largely in our hands.</p>
      <h2>1. Body weight</h2>
      <p>It is the single factor with the biggest impact. An overweight animal has more joint problems, more cardiac risk and less energy. And the extra weight rarely comes from the main meal — it comes from snacks between meals.</p>
      <h2>2. Quality and type of food</h2>
      <p>Dogs and cats are carnivores with needs very different from ours. Many digestive and skin problems improve simply by adjusting the diet — but every animal is a case of its own.</p>
      <h2>3. Routine, stimulation and rest</h2>
      <p>Walks, play and quiet places to rest. Bored animals develop destructive behaviour; stressed animals get sick more often.</p>
      <blockquote><p>No book replaces a consultation. The best content is the kind that makes you ask your vet the right questions.</p></blockquote>
      <h2>A book that explains the "why"</h2>
      <p>Dr. Tarcísio Barreto wrote a digital book on the ancestry of domestic carnivores and how modern life drifted away from those needs. No miracle promises — just principles.</p>
      [[prod:pet-longevity]]
      <p><strong>Note:</strong> this content is informational and does not replace veterinary consultations or treatments.</p>

    body: `
      <p>If you run a business, you have probably been quoted between €500 and €2000 for a website. Sometimes that is fair. Very often it is a template with your logo on it.</p>
      <h2>Why a website still matters</h2>
      <ul>
        <li>Customers search <strong>before</strong> they call. If they cannot find you, they call your competitor.</li>
        <li>Social media spreads information; a website <strong>organises</strong> it.</li>
        <li>It is the only channel that is truly yours — no algorithm, no platform rules.</li>
      </ul>
      <h2>What a good business site needs</h2>
      <ul>
        <li>One clear sentence about what you do, at the top.</li>
        <li>Services or products, with prices or "from" prices.</li>
        <li>Proof: real photos, testimonials, certifications.</li>
        <li>Contact in one click: WhatsApp, phone, email, map.</li>
        <li>Speed on mobile — that is where most visits happen.</li>
      </ul>
      <h2>The DIY alternative</h2>
      <p>Ready-made kits exist: you get the site files, swap text, colours and contact details, and publish on free static hosting. No monthly fee and no dependency on anyone to update content.</p>
      [[prod:website-kits]]
      <h2>The trade-off</h2>
      <p><strong>DIY</strong> (€140): full autonomy, you need two afternoons and the manual. <strong>With support</strong> (€200): 30 days of guidance while you edit and publish. If you have never touched a website file, the support plan is worth it.</p>
      <h2>Mistake to avoid</h2>
      <p>Do not publish with demo data. Replace phone, address, prices, names and images with real, authorised information before sharing the link.</p>
    `

    body: `
      <p>Herbal remedy does not mean "anything goes". Some preparations have centuries of use; others just waste your time. These five are the ones I keep in my routine — with common sense and never instead of a doctor.</p>
      <h2>1. Ginger for nausea and heavy digestion</h2>
      <p>A thin slice in hot water with a little lemon helps with that heavy stomach after a big meal. One of the most studied and safest preparations.</p>
      <h2>2. Chamomile tea for restless nights</h2>
      <p>It is not a sedative, but it relaxes — and the ritual of stopping ten minutes before bed is half the effect. One spoon of flowers per cup, freshly boiled water, five minutes of infusion.</p>
      <h2>3. Honey and lemon for the throat</h2>
      <p>Soothes irritation and hydrates. It does not cure an infection, but it makes the week much more bearable. One spoon of honey in warm — never boiling — water.</p>
      <blockquote><p>Golden rule: herbal remedies soothe and support. If pain lasts more than a few days, the answer is a doctor — not another tea.</p></blockquote>
      <h2>4. Garlic and onion in your daily food</h2>
      <p>More useful than expensive supplements: using garlic and onion every day is one of the cheapest ways to support immunity. Consistency beats dosage.</p>
      <h2>5. Lemon water in the morning</h2>
      <p>Helps hydration and creates a marker to start the day better. It does not "burn fat" — but hydrating well in the morning improves mood and reduces snacking.</p>
      <h2>Going deeper</h2>
      <p>For the exact quantities, the right plants and step-by-step preparations, a dedicated guide saves months of trial and error.</p>
      [[prod:herbal-remedies]]
      <h2>Important</h2>
      <p>This text is informational. If you are pregnant, take regular medication or have a health condition, talk to a professional before starting any preparation.</p>

}

/* =====================================================================
   FILTERS
   ===================================================================== */
function bindFilters(startCat) {
  const grid = $("#prodGrid"), empty = $("#prodEmpty"), search = $("#search");
  let cat = startCat || "all", q = "";
  function draw() {
    const res = PRODUCTS.filter(p => {
      const okCat = cat === "all" || p.category === cat;
      const txt = (p.name + " " + p.subtitle + " " + p.tagline + " " + catOf(p.category).name).toLowerCase();
      return okCat && txt.includes(q.trim().toLowerCase());
    });
    grid.innerHTML = res.map(productCard).join("");
    empty.style.display = res.length ? "none" : "block";
    revealNow();
  }
  document.querySelectorAll("#catFilters .fbtn").forEach(b => {
    b.addEventListener("click", () => {
      document.querySelectorAll("#catFilters .fbtn").forEach(x => x.classList.remove("on"));
      b.classList.add("on"); cat = b.dataset.cat; draw();
    });
  });
  if (search) search.addEventListener("input", e => { q = e.target.value; draw(); });
  draw();
}

/* =====================================================================
   ROUTER
   ===================================================================== */
function revealNow() {
  const els = document.querySelectorAll(".reveal:not(.in)");
  if (!("IntersectionObserver" in window)) { els.forEach(e => e.classList.add("in")); return; }
  const io = new IntersectionObserver((ents) => {
    ents.forEach(en => { if (en.isIntersecting) { en.target.classList.add("in"); io.unobserve(en.target); } });
  }, { threshold: .06 });
  els.forEach((e, i) => { e.style.transitionDelay = Math.min(i * 45, 260) + "ms"; io.observe(e); });
}

function render() {
  const raw = location.hash.replace(/^#/, "") || "/";
  const path = raw.split("?")[0];
  const app = $("#app");
  let html = "";

  if (path === "/") html = viewHome();
  else if (path.startsWith("/catalogue")) html = viewCatalogue();
  else if (path.startsWith("/product/")) html = viewProduct(path.split("/product/")[1]);
  else if (path.startsWith("/articles")) html = viewArticles();
  else if (path.startsWith("/article/")) html = viewArticle(path.split("/article/")[1]);
  else if (path.startsWith("/about")) html = viewAbout();
  else if (path.startsWith("/how-it-works")) html = viewHowItWorks();
  else if (path.startsWith("/contact")) html = viewContact();
  else if (path.startsWith("/affiliate-disclosure")) html = viewLegal("affiliate-disclosure");
  else if (path.startsWith("/privacy")) html = viewLegal("privacy");
  else html = view404();

  app.innerHTML = html;
  window.scrollTo(0, 0);

  document.querySelectorAll(".nav-links a[data-route]").forEach(a => {
    const r = a.dataset.route;
    a.classList.toggle("on", r === "/" ? path === "/" : path.startsWith(r));
  });
  $("#navLinks").classList.remove("open");

  if (path.startsWith("/catalogue")) {
    const params = new URLSearchParams(raw.split("?")[1] || "");
    bindFilters(params.get("cat") || "all");
  }

  // product gallery thumbnails
  document.querySelectorAll("[data-gal]").forEach(t => {
    t.addEventListener("click", () => {
      const main = $("#pdpImg"); if (main) main.src = t.dataset.gal;
      document.querySelectorAll("[data-gal]").forEach(x => x.style.borderColor = "var(--line)");
      t.style.borderColor = "rgba(236,72,153,.7)";
    });
  });

  revealNow();
  syncChrome();
  setMeta(path, raw);
}

/* título + canonical + descrição por página (SEO) */
function setMeta(path, raw) {
  const dom = (typeof SITE_META !== "undefined" && SITE_META.domain) ? SITE_META.domain : "";
  let title = SITE.brand + " — " + SITE.tagline;
  let desc = "Curated digital products across health, languages, AI, crypto, pets and business.";

  if (path.startsWith("/product/")) {
    const p = prodOf(path.split("/product/")[1]);
    if (p) { title = p.name + " — " + SITE.brand; desc = p.tagline; }
  } else if (path.startsWith("/article/")) {
    const a = ARTICLES.find(x => x.slug === path.split("/article/")[1]);
    if (a) { title = a.title + " — " + SITE.brand; desc = a.excerpt; }
  } else if (path.startsWith("/catalogue")) {
    title = "Catalogue — all products | " + SITE.brand;
    desc = "All curated digital products with real prices, specs and honest limits.";
  } else if (path.startsWith("/articles")) {
    title = "Reviews & guides | " + SITE.brand;
    desc = "Honest breakdowns of every product: who it fits and where its limits are.";
  } else if (path.startsWith("/how-it-works")) {
    title = "How buying works | " + SITE.brand;
    desc = "Four steps: pick a product, use my link, pay the normal price, get instant access.";
  } else if (path.startsWith("/about")) {
    title = "About | " + SITE.brand;
  } else if (path.startsWith("/contact")) {
    title = "Contact | " + SITE.brand;
  } else if (path.startsWith("/affiliate-disclosure")) {
    title = "Affiliate disclosure | " + SITE.brand;
  } else if (path.startsWith("/privacy")) {
    title = "Privacy policy | " + SITE.brand;
  }

  document.title = title;
  const md = document.querySelector('meta[name=description]');
  if (md) md.setAttribute("content", desc);
  const ogt = document.querySelector('meta[property="og:title"]');
  if (ogt) ogt.setAttribute("content", title);

  if (dom && dom.indexOf("SEU-DOMINIO") === -1) {
    const u = "https://" + dom + "/" + raw.replace(/^\//, "");
    const can = document.querySelector("link[rel=canonical]");
    if (can) can.href = u;
    const ogu = document.querySelector('meta[property="og:url"]');
    if (ogu) ogu.setAttribute("content", u);
  }
}

/* footer + brand chrome */
function syncChrome() {
  document.querySelectorAll("[data-brand]").forEach(e => e.textContent = SITE.brand);
  document.querySelectorAll("[data-brand-letter]").forEach(e => e.textContent = SITE.brand[0]);
  const about = $("#footAbout"); if (about) about.textContent = SITE.about.p2;
  const copy = $("#footCopy"); if (copy) copy.textContent = SITE.copyright;
  const note = $("#footNote"); if (note) note.textContent = SITE.footerNote;
  const fp = $("#footProducts");
  if (fp) fp.innerHTML = PRODUCTS.filter(p => p.id !== "whatsapp-advice").slice(0, 4)
    .map(p => `<a href="#/product/${p.id}">${esc(p.name.length > 30 ? p.name.slice(0, 30) + "…" : p.name)}</a>`).join("");
  const fs = $("#footSocial"); if (fs) fs.innerHTML = socialLinks();
  const fw = $("#footWa");
  if (fw) fw.innerHTML = `<a class="btn btn-wa btn-sm" href="${esc(SITE.whatsappUrl)}" target="_blank" rel="noopener">${icon("send", 15)} WhatsApp</a>`;
}
